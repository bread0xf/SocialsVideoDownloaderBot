name: socialsvideodownloaderbot

x-app-environment: &app-environment
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-socialsvideodownloaderbot}
  REDIS_URL: redis://redis:6379/0

x-app-dependencies: &app-dependencies
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

x-app-env-file: &app-env-file
  - path: .env
    required: false

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-socialsvideodownloaderbot}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: ["svdb-api"]
    restart: unless-stopped
    env_file: *app-env-file
    environment: *app-environment
    depends_on: *app-dependencies
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build: .
    command: ["svdb-bot"]
    restart: unless-stopped
    env_file: *app-env-file
    environment: *app-environment
    depends_on: *app-dependencies

  worker:
    build: .
    command: ["svdb-worker"]
    restart: unless-stopped
    env_file: *app-env-file
    environment: *app-environment
    depends_on: *app-dependencies
    volumes:
      - media-data:/app/storage

volumes:
  postgres-data:
  media-data:
