[project]
name = "socialsvideodownloaderbot"
version = "0.1.0"
description = "Telegram bot for downloading public social-media videos"
readme = "README.md"
authors = [
    { name = "Bread", email = "blood.on.bread@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "arq>=0.28.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "python-telegram-bot>=22.8",
    "redis>=5.3.1",
    "sqlalchemy[asyncio]>=2.1.8",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
    "yt-dlp>=2026.10.26",
    "yt-dlp-ejs>=0.8.0",
]

[project.scripts]
svdb-bot = "apps.bot.main:main"
svdb-api = "backend.api.main:main"
svdb-worker = "backend.workers.main:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.3",
    "testcontainers>=4.15.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend", "apps"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["backend", "apps", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "apps"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:multipart.*",
]

[tool.coverage.run]
branch = true
source = ["backend", "apps"]

[tool.mypy]
python_version = "3.13"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
